

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shopping Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Shopping Store</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#products">Products</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h2>Welcome to My Store</h2>
        <p>Shop your favourite products at affordable prices.</p>
        <a href="#products" class="btn">Shop Now</a>
    </section>

    <section id="products">
        <h2>Our Products</h2>

        <div class="product-grid">

            <div class="product">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400" alt="Watch">
                <h3>Watch</h3>
                <p>Price: Rs. 1500</p>
                <button>Buy Now</button>
            </div>

            <div class="product">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400" alt="Shoes">
                <h3>Shoes</h3>
                <p>Price: Rs. 2500</p>
                <button>Buy Now</button>
            </div>

            <div class="product">
                <img src="https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=400" alt="Bag">
                <h3>Bag</h3>
                <p>Price: Rs. 2000</p>
                <button>Buy Now</button>
            </div>

        </div>
    </section>

    <footer id="contact">
        <p>Contact: myshop@example.com</p>
        <p>© 2026 My Shopping Store</p>
    </footer>

</body>
</html>
